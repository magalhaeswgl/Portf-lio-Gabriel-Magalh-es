<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CodeMode — Bouncing Ball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            cursor: grab;
            pointer-events: auto;
        }
        canvas:active {
            cursor: grabbing;
        }
        #toggleBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ff41;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff41;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3), inset 0 0 10px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            user-select: none;
            pointer-events: auto;
        }
        #toggleBtn:hover {
            background: rgba(0, 255, 65, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6), inset 0 0 15px rgba(0, 255, 65, 0.2);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
        }
        #toggleBtn:active {
            transform: scale(0.96);
        }
        #toggleBtn.paused {
            color: #ff4136;
            border-color: #ff4136;
            box-shadow: 0 0 10px rgba(255, 65, 54, 0.3), inset 0 0 10px rgba(255, 65, 54, 0.1);
        }
        #toggleBtn.paused:hover {
            background: rgba(255, 65, 54, 0.15);
            box-shadow: 0 0 20px rgba(255, 65, 54, 0.6), inset 0 0 15px rgba(255, 65, 54, 0.2);
            text-shadow: 0 0 8px rgba(255, 65, 54, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="toggleBtn">Parar</button>

    <script>
        (function() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const toggleBtn = document.getElementById("toggleBtn");

            let animationId = null;
            let isActive = true;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            function randomColor() {
                return `hsl(${Math.random() * 360}, 90%, 60%)`;
            }

            const ball = {
                x: window.innerWidth / 2,
                y: 200,
                radius: 60,
                vx: 0,
                vy: 0,
                gravity: 0.7,
                bounce: 0.85,
                color: randomColor()
            };

            let dragging = false;
            let launchX = 0;
            let launchY = 0;
            let visualScaleX = 1;
            let visualScaleY = 1;

            function getMouse(e) {
                const r = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - r.left,
                    y: e.clientY - r.top
                };
            }

            canvas.addEventListener("mousedown", e => {
                if (!isActive) return;
                const m = getMouse(e);
                const dx = m.x - ball.x;
                const dy = m.y - ball.y;

                if (Math.hypot(dx, dy) <= ball.radius) {
                    dragging = true;
                    launchX = ball.x;
                    launchY = ball.y;
                    ball.vx = 0;
                    ball.vy = 0;
                }
            });

            canvas.addEventListener("mousemove", e => {
                if (!dragging || !isActive) return;
                const m = getMouse(e);
                ball.x = m.x;
                ball.y = m.y;
            });

            window.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;
                ball.vx = (launchX - ball.x) * 0.25;
                ball.vy = (launchY - ball.y) * 0.25;
            });

            function draw() {
                if (!isActive) return;

                const ground = canvas.height - 100;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (!dragging) {
                    ball.vy += ball.gravity;
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.vx *= 0.999;
                }

                // COLISÕES
                if (!dragging) {
                    if (ball.x - ball.radius < 0) {
                        ball.x = ball.radius;
                        ball.vx *= -0.9;
                        ball.color = randomColor();
                    }
                    if (ball.x + ball.radius > canvas.width) {
                        ball.x = canvas.width - ball.radius;
                        ball.vx *= -0.9;
                        ball.color = randomColor();
                    }
                    if (ball.y - ball.radius < 0) {
                        ball.y = ball.radius;
                        ball.vy *= -0.9;
                        ball.color = randomColor();
                    }
                    if (ball.y + ball.radius > ground) {
                        ball.y = ground - ball.radius;
                        ball.vy *= -ball.bounce;
                        if (Math.abs(ball.vy) > 2) {
                            ball.color = randomColor();
                        }
                    }
                }

                // DEFORMAÇÃO
                let targetScaleX = 1;
                let targetScaleY = 1;

                if (dragging) {
                    const floorPen = Math.max(0, ball.y + ball.radius - ground);
                    const leftPen = Math.max(0, ball.radius - ball.x);
                    const rightPen = Math.max(0, ball.x + ball.radius - canvas.width);
                    const topPen = Math.max(0, ball.radius - ball.y);
                    const horizontal = leftPen + rightPen;
                    const vertical = floorPen + topPen;

                    targetScaleX += vertical * 0.018;
                    targetScaleY -= vertical * 0.014;
                    targetScaleX -= horizontal * 0.014;
                    targetScaleY += horizontal * 0.018;
                } else {
                    const speed = Math.min(Math.hypot(ball.vx, ball.vy), 35);
                    if (ball.y + ball.radius >= ground - 2) {
                        const squash = speed * 0.015;
                        targetScaleX = 1 + squash;
                        targetScaleY = 1 - squash;
                    } else {
                        const stretch = speed * 0.008;
                        targetScaleX = 1 - stretch;
                        targetScaleY = 1 + stretch;
                    }
                }

                targetScaleX = Math.max(0.35, targetScaleX);
                targetScaleY = Math.max(0.35, targetScaleY);
                visualScaleX += (targetScaleX - visualScaleX) * 0.15;
                visualScaleY += (targetScaleY - visualScaleY) * 0.15;

                // CHÃO
                ctx.strokeStyle = "white";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, ground);
                ctx.lineTo(canvas.width, ground);
                ctx.stroke();

                // LINHA DE LANÇAMENTO
                if (dragging) {
                    ctx.strokeStyle = "rgba(255,255,255,.35)";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(launchX, launchY);
                    ctx.lineTo(ball.x, ball.y);
                    ctx.stroke();
                }

                // SOMBRA
                const h = ground - (ball.y + ball.radius);
                const shadowWidth = Math.max(20, 130 - h * 0.15);
                ctx.fillStyle = `rgba(0,0,0,${Math.max(0.15, 0.6 - h / 400)})`;
                ctx.beginPath();
                ctx.ellipse(ball.x, ground + 12, shadowWidth, shadowWidth * 0.25, 0, 0, Math.PI * 2);
                ctx.fill();

                // BOLA
                ctx.save();
                ctx.translate(ball.x, ball.y);
                ctx.scale(visualScaleX, visualScaleY);

                const grad = ctx.createRadialGradient(-20, -20, 5, 0, 0, ball.radius);
                grad.addColorStop(0, "#fff");
                grad.addColorStop(1, ball.color);

                ctx.fillStyle = grad;
                ctx.shadowBlur = 40;
                ctx.shadowColor = ball.color;
                ctx.beginPath();
                ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                animationId = requestAnimationFrame(draw);
            }

            function start() {
                if (animationId) cancelAnimationFrame(animationId);
                isActive = true;
                toggleBtn.textContent = 'Parar';
                toggleBtn.classList.remove('paused');
                draw();
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'ANIMATION_STATE', animation: 'codemode', active: true }, '*');
                }
            }

            function stop() {
                isActive = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                toggleBtn.textContent = 'Retomar';
                toggleBtn.classList.add('paused');
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'ANIMATION_STATE', animation: 'codemode', active: false }, '*');
                }
            }

            toggleBtn.addEventListener('click', () => {
                if (isActive) stop();
                else start();
            });

            // Permite o pai pausar/retomar remotamente
            window.addEventListener('message', (event) => {
                if (!event.data) return;
                if (event.data.type === 'STOP_ANIMATION') stop();
                if (event.data.type === 'START_ANIMATION') start();
            });

            // Expor controles para o pai (via contentWindow.codemodeControls)
            window.codemodeControls = { start, stop };

            start();
        })();
    </script>
</body>
</html>
