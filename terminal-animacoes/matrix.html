<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Matrix Rain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: transparent !important;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            pointer-events: none;
        }
        #toggleBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ff41;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff41;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3), inset 0 0 10px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            user-select: none;
            pointer-events: auto;
        }
        #toggleBtn:hover {
            background: rgba(0, 255, 65, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6), inset 0 0 15px rgba(0, 255, 65, 0.2);
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
        }
        #toggleBtn:active {
            transform: scale(0.96);
        }
        #toggleBtn.paused {
            color: #ff4136;
            border-color: #ff4136;
            box-shadow: 0 0 10px rgba(255, 65, 54, 0.3), inset 0 0 10px rgba(255, 65, 54, 0.1);
        }
        #toggleBtn.paused:hover {
            background: rgba(255, 65, 54, 0.15);
            box-shadow: 0 0 20px rgba(255, 65, 54, 0.6), inset 0 0 15px rgba(255, 65, 54, 0.2);
            text-shadow: 0 0 8px rgba(255, 65, 54, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <button id="toggleBtn">Parar</button>
    <script>
        (function() {
            const canvas = document.getElementById('matrixCanvas');
            const toggleBtn = document.getElementById('toggleBtn');
            let ctx = canvas.getContext('2d');
            let width, height;
            let animationId = null;
            let isActive = true;

            // Caracteres estilo Matrix: letras, números e símbolos (sem japonês)
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=<>{}[]/\\|~^";
            const charsArray = chars.split('');

            let columns = 0;
            let drops = [];
            let fontSize = 16;

            function resizeAndInit() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;

                fontSize = Math.max(14, Math.min(24, Math.floor(width / 50)));
                columns = Math.ceil(width / fontSize) + 2;

                const oldDrops = [...drops];
                drops = [];
                for (let i = 0; i < columns; i++) {
                    if (i < oldDrops.length && oldDrops[i] !== undefined) {
                        drops.push(Math.min(oldDrops[i], height / fontSize));
                    } else {
                        drops.push(Math.random() * -50);
                    }
                }
            }

            function draw() {
                if (!isActive) return;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, width, height);

                ctx.font = `${fontSize}px 'Courier New', monospace`;
                ctx.textAlign = 'center';

                for (let i = 0; i < drops.length; i++) {
                    const x = i * fontSize + fontSize / 2;
                    const y = drops[i] * fontSize;

                    if (y > 0 && y < height + fontSize) {
                        const intensity = Math.min(1, 1 - (drops[i] / (height / fontSize)) * 0.5);
                        const greenValue = Math.floor(80 + 175 * intensity);

                        ctx.shadowBlur = 6;
                        ctx.shadowColor = `rgba(0, ${greenValue}, 0, 0.6)`;
                        ctx.fillStyle = `rgb(0, ${greenValue}, 0)`;

                        const char = charsArray[Math.floor(Math.random() * charsArray.length)];
                        ctx.fillText(char, x, y);

                        if (drops[i] < 3) {
                            ctx.fillStyle = `rgb(100, 255, 100)`;
                            ctx.fillText(char, x, y);
                        }
                    }

                    drops[i] += 0.8 + Math.random() * 0.5;

                    if (drops[i] * fontSize > height + fontSize || (drops[i] > 5 && Math.random() < 0.005)) {
                        drops[i] = 0;
                    }
                }

                ctx.shadowBlur = 0;
            }

            function animate() {
                if (!isActive) return;
                draw();
                animationId = requestAnimationFrame(animate);
            }

            function start() {
                if (animationId) cancelAnimationFrame(animationId);
                resizeAndInit();
                isActive = true;
                animate();
                toggleBtn.textContent = 'Parar';
                toggleBtn.classList.remove('paused');
                // avisa o pai que está rodando
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'ANIMATION_STATE', animation: 'matrix', active: true }, '*');
                }
            }

            function stop() {
                isActive = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                ctx.clearRect(0, 0, width, height);
                toggleBtn.textContent = 'Retomar';
                toggleBtn.classList.add('paused');
                // avisa o pai que foi pausada
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'ANIMATION_STATE', animation: 'matrix', active: false }, '*');
                }
            }

            toggleBtn.addEventListener('click', () => {
                if (isActive) stop();
                else start();
            });

            // permite o pai pausar/retomar remotamente
            window.addEventListener('message', (event) => {
                if (!event.data) return;
                if (event.data.type === 'STOP_ANIMATION') stop();
                if (event.data.type === 'START_ANIMATION') start();
            });

            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (isActive) {
                        stop();
                        start();
                    }
                }, 150);
            });

            start();

            window.matrixControls = { start, stop };
        })();
    </script>
</body>
</html>
